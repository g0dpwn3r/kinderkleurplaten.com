services:
  wordpress-db:
    image: mariadb:10.11
    container_name: wordpress-db
    restart: unless-stopped
    environment:
       MYSQL_ROOT_PASSWORD: EJ!jdU|Rf3|mtAMAQgKNOKaHcx9yeu@B6GIPD6EXV!OBvKznhPZdd6|
       MYSQL_DATABASE: kinderkluerplaten
       MYSQL_USER: root
       MYSQL_PASSWORD: EJ!jdU|Rf3|mtAMAQgKNOKaHcx9yeu@B6GIPD6EXV!OBvKznhPZdd6|
    volumes:
      - /mnt/data_ssd/docker/wordpress/db:/var/lib/mysql
    networks:
      - wordpress-net

  wordpress:
    image: wordpress:latest
    container_name: wordpress-app
    restart: unless-stopped
    depends_on:
      - wordpress-db
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: kinderkluerplaten
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: EJ!jdU|Rf3|mtAMAQgKNOKaHcx9yeu@B6GIPD6EXV!OBvKznhPZdd6|
    volumes:
      - /mnt/data_ssd/kinderkleurplaten.com:/var/www/html
    networks:
      - wordpress-net
      - proxy-net
    env_file:
      - .env

networks:
  wordpress-net:
    driver: bridge
  proxy-net:
    external: true
